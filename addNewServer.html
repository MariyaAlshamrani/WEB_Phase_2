<body>
<form action="provider.html" method="post" enctype="multipart/form-data">
    <fieldset>
        <legend><h2>project Information:</h2></legend>

        <div class="input-group">
            <label for="service-photo">Add service Photo:</label>
            <label for="service-photo" class="upload-btn">Choose Image</label>
            <input type="file" id="service-photo" name="service-photo">
            <div class="image-preview">
                Click "Choose Image" to upload a photo
            </div>
        </div>

        <div class="input-group">
            <label for="service-name">Name:</label>
            <input type="text" id="service-name" name="service-name" placeholder="Enter service name">
        </div>

        <div class="input-group">
            <label for="city-select">City:</label>
            <select id="city-select" name="city">
                <option value="" disabled selected>Select a city</option>
                <option value="radio">Riyadh</option>
                <option value="radio">Alula</option>
                <option value="radio">Jeddah</option>
                <option value="radio">Neom</option>
                <option value="radio">Abha</option>
                <option value="radio">Jubail</option>
                <option value="radio">Dammam</option>
            </select>
        </div>

        <div class="input-group">
            <label for="service-price">Price:</label>
            <input type="text" id="service-price" name="price" placeholder="Enter price">
        </div>

        <div class="input-group">
            <label for="service-description">Description:</label>
            <textarea id="service-description" name="description" placeholder="Enter service description"></textarea>
        </div>

        <button type="submit" >Add</button>
    </fieldset>
</form>
