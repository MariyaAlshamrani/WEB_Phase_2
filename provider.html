
<html lang="en" dir="ltr">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Provider </title>
	<link rel="stylesheet" href="Style.css">
    <style>

        .services-list-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            overflow-x: auto;
            padding-bottom: 10px;
            width: 100%;
            margin-bottom: 20px;
        }

        .service-card {
            padding: 10px;
            width: 200px;
            flex-shrink: 0;
        }

        .card-header {
            position: relative;
            margin-bottom: 10px;
        }

        .service-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
            background-color: #eaeaea;
            margin-bottom: 10px;
        }

        .edit-icon {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 18px;
            text-decoration: none;
            padding: 3px 6px;
            z-index: 10;
            line-height: 1;
        }

        .card-body p {
            margin: 3px 0;
            font-size: 14px;
            text-align: left;
        }

        .service-name {
            font-weight: bold;
        }

        .action-buttons-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: flex-start;
        }

        .action-button {
            background: linear-gradient(90deg, #9b6fff, #00bcd4);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            text-align: center;
            display: inline-block;
            margin-top: 10px;
        }
		
        /* Tablet */
        @media screen and (min-width: 600px) {
            .action-buttons-container {
                flex-direction: row;
                justify-content: flex-start;
            }

            .action-button {
                flex: 0 1 auto;
            }
        }

        /* Desktop */
        @media screen and (min-width: 1024px) {
            .services-list-container {
                min-height: 400px;
            }

            .service-card {
                width: calc(25% - 20px);
            }

            .service-image {
                height: 180px;
            }
        }

        /* Mobile Small */
        @media screen and (max-width: 480px) {
            .services-list-container {
                min-height: 250px;
            }

            .service-card {
                width: 100%;
                padding: 12px;
            }

            .service-image {
                height: 120px;
            }

            .action-button {
                padding: 12px 20px;
                font-size: 0.95rem;
            }
            
          
        }
    </style>
</head>
