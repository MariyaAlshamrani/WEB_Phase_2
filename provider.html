<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Provider</title>
	<link rel="stylesheet" href="Style.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .content-wrapper {
            flex: 1;
            padding: 20px 10px;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
            font-size: 1.8em;
        }

        .services-list-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 95%;
            max-width: 1200px;
            margin: 0 auto 30px;
            min-height: 300px;
            border: 2px dashed rgba(169, 138, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
        }

        .service-card {
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid #282828;
            border-radius: 8px;
            transition: transform 0.3s;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(169, 138, 255, 0.3);
        }

        .card-header {
            position: relative;
            margin-bottom: 10px;
        }

        .service-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            background-color: #eaeaea;
            border-radius: 5px;
        }

        .edit-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 20px;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 8px;
            border-radius: 5px;
            z-index: 10;
            line-height: 1;
            color: white;
        }

        .card-body p {
            margin: 5px 0;
            font-size: 14px;
            text-align: left;
            color: #ccc;
        }

        .service-name {
            font-weight: bold;
            font-size: 16px;
            color: #fff;
        }

        .action-buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 95%;
            max-width: 1200px;
            margin: 0 auto 30px;
        }

        .action-button {
            background: linear-gradient(90deg, #9b6fff, #00bcd4);
            border: none;
            color: white;
            padding: 14px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            text-align: center;
            display: inline-block;
            text-decoration: none;
            font-size: 1rem;
        }

        .action-button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(0, 188, 212, 0.5);
        }

        /* Empty State */
        .empty-state {
            width: 100%;
            text-align: center;
            padding: 40px 20px;
        }

        .empty-state h3 {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #a98aff;
        }

        .empty-state p {
            font-size: 1.2em;
            color: #ccc;
            line-height: 1.6;
        }

        /* Tablet */
        @media screen and (min-width: 600px) {
            .action-buttons-container {
                flex-direction: row;
                justify-content: flex-start;
            }

            .action-button {
                flex: 0 1 auto;
            }
        }

        /* Desktop */
        @media screen and (min-width: 1024px) {
            .services-list-container {
                min-height: 400px;
            }

            .service-card {
                width: calc(25% - 20px);
            }

            .service-image {
                height: 180px;
            }
        }

        /* Mobile Small */
        @media screen and (max-width: 480px) {
            .services-list-container {
                min-height: 250px;
            }

            .service-card {
                width: 100%;
                padding: 12px;
            }

            .service-image {
                height: 120px;
            }

            .action-button {
                padding: 12px 20px;
                font-size: 0.95rem;
            }
            
            .empty-state h3 {
                font-size: 1.4em;
            }
            
            .empty-state p {
                font-size: 1em;
            }
        }
    </style>
</head>
